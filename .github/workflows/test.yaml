# .github/workflows/test.yaml
name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test changelog checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate changelog PR number
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/check_changelog_pr.py \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.number }}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...
        env:
          # Integration tests will be skipped if TEST_REFRESH_TOKEN is not set
          TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}
