# .github/workflows/test.yaml
name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On pull requests HEAD is the merge commit; the changelog check reads its base, HEAD^1.
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Lint test goroutine assertions
        run: go vet -testinggoroutine ./...

      - name: Run tests
        run: go test -v -race ./...
        env:
          # Integration tests will be skipped if TEST_REFRESH_TOKEN is not set
          TEST_REFRESH_TOKEN: ${{ secrets.TEST_REFRESH_TOKEN }}

      # Only on pull requests: a bullet cites its own PR, which a branch push may precede.
      - name: Check CHANGELOG bullets cite pull requests
        if: github.event_name == 'pull_request'
        run: go test -count=1 -run '^TestRepoChangelogCites(PullRequests|ThisPullRequest)$' -v ./internal/changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGELOG_BASE_REF: HEAD^1
